<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  :root {
    --bg: #FBFAF7; --panel: #ffffff; --ink: #1F1C18; --ink-soft: #4E4841; --muted: #797167;
    --accent: #1e3a5f; --accent-hover: #2a4e7a; --accent-soft: #e8eef5; --rule: #E9E5DE; --rule-strong: #D9D3C9; --chip: #F3F0EA;
    --radius-lg: 14px; --shadow-md: 0 4px 18px rgba(20, 20, 30, 0.06);
    --display: 'Libre Caslon Text', 'Iowan Old Style', Georgia, serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: linear-gradient(180deg, #FBFAF7 0%, #F6F3EE 100%) fixed; color: var(--ink); }
  body { font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 100; padding: 8px 12px; background: var(--accent); color: #fff; border-radius: 8px; font-weight: 600; text-decoration: none; }
  .skip:focus { left: 8px; outline: 3px solid #fff; outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- site header, the same on every page ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 56px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 18px; }
  .brandrow { display: inline-flex; align-items: center; gap: 14px; min-width: 0; }
  .wordmark { display: inline-flex; align-items: center; gap: .42em; font-family: var(--display); font-size: 1.28rem; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .wordmark .mark { width: 1.2em; height: 1.2em; flex: none; color: var(--accent); }
  .wordmark i { font-style: normal; color: #C08A62; }
  .topbar nav { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .topbar nav a { font-size: .92rem; color: var(--ink-soft); text-decoration: none; padding: 6px 0; border-bottom: 1px solid transparent; }
  .topbar nav a:hover { color: var(--ink); border-bottom-color: var(--rule-strong); }
  .topbar nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  .topbar a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .classname { font-size: .86rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; padding-left: 14px; border-left: 1.5px solid var(--rule-strong); line-height: 1.3; }
  @media (max-width: 720px) { .classname { max-width: 58vw; font-size: .8rem; } }
  @media (max-width: 720px) {
    .topbar { flex-wrap: wrap; row-gap: 8px; padding-top: 16px; }
    .brandrow { flex: 1 0 100%; }
    .wordmark { font-size: 1.18rem; }
    .topbar nav { gap: 16px; }
    .topbar nav a { white-space: nowrap; font-size: .88rem; }
  }

  /* ---------- page ---------- */
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 1.2rem + 2vw, 2.6rem); line-height: 1.1; margin: 10px 0 6px; }
  .lede { margin: 0 0 18px; color: var(--ink-soft); max-width: 70ch; }
  .lede strong { color: var(--ink); font-weight: 600; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 18px; }
  .search { flex: 1 1 280px; position: relative; }
  .search input {
    width: 100%; font: inherit; padding: 10px 12px 10px 38px; border: 1.5px solid var(--rule-strong); border-radius: 10px;
    background: var(--panel); color: var(--ink);
  }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button {
    font: inherit; font-size: .86rem; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--rule-strong); background: var(--panel); color: var(--ink-soft);
  }
  .filters button:hover { border-color: var(--accent); color: var(--accent); }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { font-size: .88rem; color: var(--muted); margin: 0 0 12px; }

  .letters { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 0 18px; }
  .letters a { font: 600 .8rem var(--mono); color: var(--accent); text-decoration: none; padding: 4px 7px; border-radius: 6px; }
  .letters a:hover { background: var(--accent-soft); }
  .letters a.off { color: var(--muted); opacity: .45; pointer-events: none; }

  .group { margin: 0 0 22px; }
  .group h2 {
    font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 0 0 8px; padding: 0 4px;
    display: flex; align-items: baseline; gap: 12px; scroll-margin-top: 16px;
  }
  .group h2 small { font: 600 .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .entries { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
  .entry { padding: 14px 18px 15px; border-top: 1px solid var(--rule); }
  .entry:first-child { border-top: 0; }
  .entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .chip { font: 600 .66rem var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .entry p { margin: 4px 0 8px; color: var(--ink-soft); max-width: 78ch; }
  .entry .also { font-size: .84rem; color: var(--muted); margin: 0 0 8px; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; }
  .views a {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink-soft); font-size: .8rem; font-weight: 600;
    padding: 3px 10px 3px 3px; border: 1.5px solid var(--rule-strong); border-radius: 999px; background: var(--panel);
  }
  .views a:hover { border-color: var(--accent); color: var(--accent); }
  .views a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .views img { width: 28px; height: 21px; object-fit: cover; border-radius: 999px; background: #fff; }
  .empty { padding: 22px; color: var(--muted); text-align: center; }
  mark { background: #fbe8a6; color: inherit; padding: 0 1px; border-radius: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 20px 28px; }
</style>

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <div class="topbar">
    <div class="brandrow"><a class="wordmark" id="homeLink" href="index.html"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5" /><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" /><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" /><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77" /><path d="M18 18a4 4 0 0 0 2-7.464" /><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" /><path d="M6 18a4 4 0 0 1-2-7.464" /><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77" /></g></svg><span>Lambda<i>.</i></span></a><span class="classname" id="className" hidden></span></div>
    <nav aria-label="Site">
      <a href="atlas.html" id="navAtlas">Atlas</a>
      <a href="quiz.html" id="navQuiz">Quiz</a>
      <a href="glossary.html" id="navGlossary" aria-current="page">Glossary</a>
      <a href="https://github.com/torryscott/lambda">Source</a>
    </nav>
  </div>

  <main id="main">
    <h1>Glossary</h1>
    <p class="lede" id="lede">Every structure in the atlas, with its tissue type, its definition, and the views it appears in.</p>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
        <input type="search" id="q" placeholder="Search structures and definitions" aria-label="Search structures and definitions" autocomplete="off">
      </div>
      <div class="filters" role="group" aria-label="Show structures from" id="filters"></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <nav class="letters" id="letters" aria-label="Jump to a letter"></nav>
    <div id="list"></div>
  </main>
</div>
<footer>Lambda · sheep brain study guide</footer>

<script>
(function () {
  const V = window.LAMBDA_VIEWS;
  const excluded = LAMBDA.excludedMap();               // whatever the ?on= mask leaves out
  document.getElementById('homeLink').href = V.link('index.html', {});
  document.getElementById('navAtlas').href = V.link('atlas.html', {});
  document.getElementById('navQuiz').href = V.link('quiz.html', {});
  document.getElementById('navGlossary').href = V.link('glossary.html', {});
  (function () { const c = V.className(); if (c) { const el = document.getElementById('className'); el.textContent = c; el.hidden = false; } })();

  const list = document.getElementById('list'), status = document.getElementById('status');
  const q = document.getElementById('q'), filters = document.getElementById('filters'), letters = document.getElementById('letters');
  let entries = [], group = 'all';

  /* One entry per structure name. The same structure can be marked in several
     views under different flags; the glossary merges those into one entry
     that lists every view it appears in. */
  function build(datas) {
    const byName = new Map();
    datas.forEach(d => {
      const g = V.groupOf(d.view);
      d.structures.forEach(s => {
        if (excluded[s.flag]) return;
        const key = s.name.trim().toLowerCase();
        let e = byName.get(key);
        if (!e) { e = { name: s.name.trim(), matter: '', about: '', accept: new Set(), views: [], groups: new Set() }; byName.set(key, e); }
        if (!e.matter && s.matter) e.matter = s.matter;
        if ((s.about || '').length > e.about.length) e.about = s.about || '';
        (s.accept || []).forEach(a => { if (a && a.trim().toLowerCase() !== key) e.accept.add(a.trim()); });
        if (!e.views.some(v => v.id === d.view)) e.views.push({ id: d.view, label: d.label, flag: s.flag });
        if (g) e.groups.add(g.id);
      });
    });
    entries = Array.from(byName.values()).sort((a, b) => a.name.localeCompare(b.name));
    entries.forEach(e => { e.views.sort((a, b) => V.all.indexOf(a.id) - V.all.indexOf(b.id)); e.hay = (e.name + ' ' + Array.from(e.accept).join(' ') + ' ' + e.about).toLowerCase(); });
  }

  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function hi(text, term) {
    if (!term) return esc(text);
    const i = text.toLowerCase().indexOf(term);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = entries.filter(e => (group === 'all' || e.groups.has(group)) && (!term || e.hay.indexOf(term) > -1));
    list.innerHTML = '';
    const present = new Set();
    if (!shown.length) {
      list.innerHTML = '<div class="entries"><p class="empty">Nothing matches. Try a shorter word, or clear the filter.</p></div>';
    } else {
      let letter = '', sec = null, box = null;
      shown.forEach(e => {
        const L = e.name[0].toUpperCase();
        if (L !== letter) {
          letter = L; present.add(L);
          sec = document.createElement('section'); sec.className = 'group';
          sec.innerHTML = '<h2 id="letter-' + L + '">' + L + '<small></small></h2>';
          box = document.createElement('div'); box.className = 'entries';
          sec.appendChild(box); list.appendChild(sec);
        }
        const art = document.createElement('article'); art.className = 'entry';
        const also = e.accept.size ? '<p class="also">Also called ' + esc(Array.from(e.accept).join(', ')) + '.</p>' : '';
        const views = e.views.map(v => '<a href="' + V.link('atlas.html', { view: v.id, pin: v.flag }) + '" title="Open the ' + esc(v.label) + ' view with ' + esc(e.name) + ' shown"><img src="' + V.thumb(v.id) + '" alt="" loading="lazy">' + esc(v.label) + '</a>').join('');
        art.innerHTML = '<div class="entry-head"><h3>' + hi(e.name, term) + '</h3>' + (e.matter ? '<span class="chip">' + esc(e.matter) + '</span>' : '') + '</div>'
          + '<p>' + (e.about ? hi(e.about, term) : 'No definition yet.') + '</p>' + also
          + '<div class="views" aria-label="Appears in">' + views + '</div>';
        box.appendChild(art);
        sec.querySelector('small').textContent = box.children.length + (box.children.length === 1 ? ' structure' : ' structures');
      });
    }
    letters.querySelectorAll('a').forEach(a => a.classList.toggle('off', !present.has(a.textContent)));
    const views = new Set(); shown.forEach(e => e.views.forEach(v => views.add(v.id)));
    status.textContent = shown.length + (shown.length === 1 ? ' structure' : ' structures')
      + (term || group !== 'all' ? ' shown' : '') + ' across ' + views.size + (views.size === 1 ? ' view' : ' views')
      + (Object.keys(excluded).length ? ', within your instructor’s selection' : '') + '.';
  }

  // filters: all, then the three groups
  [{ id: 'all', label: 'All views' }].concat(V.groups.map(g => ({ id: g.id, label: g.label }))).forEach(f => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = f.label; b.dataset.id = f.id;
    b.setAttribute('aria-pressed', f.id === group ? 'true' : 'false');
    b.addEventListener('click', () => { group = f.id; filters.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === group ? 'true' : 'false')); render(); });
    filters.appendChild(b);
  });
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(L => { const a = document.createElement('a'); a.href = '#letter-' + L; a.textContent = L; letters.appendChild(a); });
  q.addEventListener('input', render);

  Promise.all(V.all.map(id => fetch('data/' + id + '.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + id); return r.json(); })))
    .then(datas => {
      build(datas);
      const n = entries.length, views = new Set(); entries.forEach(e => e.views.forEach(v => views.add(v.id)));
      document.getElementById('lede').innerHTML = 'Every structure in the atlas, with its tissue type, its definition, and the views it appears in. <strong>'
        + n + ' structures</strong> across ' + views.size + ' views' + (Object.keys(excluded).length ? ', within your instructor’s selection' : '') + '.';
      render();
    })
    .catch(err => { status.textContent = 'Could not load the structure data (' + err.message + '). If you opened this file directly from disk, run a local server instead.'; });
})();
</script>
</body>
</html>
