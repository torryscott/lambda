<!doctype html>
<!-- The link preview image every page points to (og:image): images/social-card.jpg.
     After editing, render this file at exactly 1200 x 630 and save it as a JPEG of about 130 KB
     (keep it under 300 KB, or WhatsApp drops the preview):
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 --screenshot=card.png "file://$PWD/scripts/social-card.html"
       sips -s format jpeg -s formatOptions 92 card.png --out images/social-card.jpg
     Facebook keeps its old copy of a link's preview until you press Scrape Again at
     https://developers.facebook.com/tools/debug/ -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lambda social card</title>
<style>
  @font-face { font-family: 'Libre Caslon Text'; src: url(../fonts/LibreCaslonText-Regular.ttf); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans'; src: url(../fonts/IBMPlexSans-Regular.ttf); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans'; src: url(../fonts/IBMPlexSans-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: 'IBM Plex Mono'; src: url(../fonts/IBMPlexMono-Medium.ttf); font-weight: 500; }
  :root {
    --ground: #FBFAF7; --ink: #1F1C18; --ink-2: #4E4841; --muted: #797167; --rule: #E9E5DE;
    --accent: #1e3a5f; --tissue: #C08A62;
    --display: 'Libre Caslon Text', Georgia, serif; --sans: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; }

  .copy { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 500px; display: flex; flex-direction: column; }
  .wordmark { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-size: 38px; letter-spacing: -.01em; }
  .wordmark svg { width: 44px; height: 44px; color: var(--accent); }
  .wordmark i, h1 i { font-style: normal; color: var(--tissue); }
  h1 { font-family: var(--display); font-weight: 400; font-size: 76px; line-height: 1.02; letter-spacing: -.022em; margin: auto 0 24px; white-space: nowrap; }
  .lede { font-family: var(--sans); font-size: 26px; line-height: 1.42; color: var(--ink-2); margin: 0 0 auto; max-width: 430px; text-wrap: balance; }
  .tags { font-family: var(--mono); font-weight: 500; font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); display: flex; gap: 14px; align-items: center; }
  .tags b { width: 6px; height: 6px; border-radius: 50%; background: var(--tissue); display: inline-block; }

  .plate { position: absolute; left: 550px; top: 112px; width: 680px; aspect-ratio: 4 / 3; }
  .plate img { display: block; width: 100%; height: 100%; mix-blend-mode: multiply; }
  .plate svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .plate svg line { stroke: rgba(30,58,95,.7); stroke-width: 2.4; }
  .dot { position: absolute; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(30,58,95,.30); transform: translate(-50%, -50%); box-sizing: content-box; }
  .pill { position: absolute; transform: translate(-50%, -50%); background: var(--accent); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 19px; letter-spacing: .01em; padding: 7px 16px; border-radius: 999px; white-space: nowrap; box-shadow: 0 3px 12px rgba(31,28,24,.18); }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="wordmark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5" /><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" /><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" /><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77" /><path d="M18 18a4 4 0 0 0 2-7.464" /><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" /><path d="M6 18a4 4 0 0 1-2-7.464" /><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77" /></g></svg>
      <span>Lambda<i>.</i></span>
    </div>
    <h1>Sheep Brain<br>Study Guide<i>.</i></h1>
    <p class="lede">An interactive atlas of a dissected sheep brain, and a quiz on the same structures.</p>
    <div class="tags"><span>Atlas</span><b></b><span>Quiz</span><b></b><span>Glossary</span></div>
  </div>

  <div class="plate">
    <img src="../images/hero/midsagittal.jpg" alt="">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="22.41" y1="46.20" x2="17" y2="86" vector-effect="non-scaling-stroke"/>
      <line x1="36.17" y1="52.41" x2="44" y2="86" vector-effect="non-scaling-stroke"/>
      <line x1="54.85" y1="43.75" x2="66" y2="8"  vector-effect="non-scaling-stroke"/>
      <line x1="87" y1="38" x2="82" y2="24" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="dot" style="left:22.41%;top:46.20%"></span>
    <span class="dot" style="left:36.17%;top:52.41%"></span>
    <span class="dot" style="left:54.85%;top:43.75%"></span>
    <span class="dot" style="left:87%;top:38%"></span>
    <span class="pill" style="left:17%;top:86%">Corpus Callosum</span>
    <span class="pill" style="left:44%;top:86%">Thalamus</span>
    <span class="pill" style="left:66%;top:8%">Superior Colliculus</span>
    <span class="pill" style="left:82%;top:24%">Cerebellum</span>
  </div>
</div>
</body>
</html>
